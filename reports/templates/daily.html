<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 24px; background: #f3f6fa; color: #172338; font-family: Arial, sans-serif; }
    main { max-width: 720px; margin: auto; padding: 28px; background: #fff; border: 1px solid #e3e9f1; border-radius: 12px; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    h2 { margin: 26px 0 10px; font-size: 17px; }
    .muted { color: #718096; }
    .metric { margin: 18px 0; padding: 16px; background: #f3f6fa; border-radius: 8px; }
    .metric strong { display: block; margin-top: 5px; font-size: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #edf1f5; text-align: left; }
    th { color: #64748b; font-size: 12px; }
    td:last-child, th:last-child { text-align: right; }
    ul { padding-left: 20px; }
    li { margin: 7px 0; }
    img { display: block; width: 100%; max-width: 640px; height: auto; margin: 10px auto; }
    footer { margin-top: 24px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Raport dzienny ActivityTracker</h1>
    <div class="muted">Data: $report_date</div>
    <div class="metric">Łączny czas aktywności<strong>$total_time</strong></div>
    <h2>Aplikacje</h2>
    <table>
      <thead><tr><th>Aplikacja</th><th>Czas</th><th>Udział</th></tr></thead>
      <tbody>$app_rows</tbody>
    </table>
    <h2>Najczęściej używane aplikacje</h2>
    <ol>$top_apps</ol>
    <h2>Podział czasu</h2>
    <img src="cid:$chart_cid" alt="Wykres czasu użycia aplikacji">
    <footer>Raport zawiera wyłącznie zagregowane nazwy procesów i czas ich użycia.</footer>
  </main>
</body>
</html>
